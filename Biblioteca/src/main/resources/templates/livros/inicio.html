<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Biblioteca - Livros</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<h1 th:text="${titulo} ?: 'Gerenciamento de Livros'"></h1>
<p th:text="${texto} ?: 'Menu inicial do Sistema de Biblioteca, acesse as abas desejadas abaixo:'"></p>

<nav>
    <a th:href="@{/livros}">Livros</a>
    <a th:href="@{/autores}">Autores</a>
    <a th:href="@{/categorias}">Categorias</a>
    <a th:href="@{/usuarios}">Usuários</a>
    <a th:href="@{/emprestimos}">Empréstimos</a>
</nav>

<hr>

<h2>Cadastrar Novo Livro</h2>
<form th:action="@{/livros}" method="POST" th:object="${novoLivro}">
    <div>
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" th:field="*{titulo}" required>
    </div>
    <div>
        <label for="autor">Autor:</label>
        <input type="text" id="autor" th:field="*{autor}" required>
    </div>
    <div>
        <label for="isnb">ISNB:</label>
        <input type="text" id="isnb" th:field="*{isnb}" required>
    </div>
    <button type="submit">Salvar Livro</button>
</form>

<hr>

<h2>Livros na Memória</h2>
<table border="1">
    <thead>
    <tr>
        <th>Título</th>
        <th>Autor</th>
        <th>ISNB</th>
        <th>Ações</th>
    </tr>
    </thead>
    <tbody>

    <tr th:each="livro, stat : ${livros}">
        <td th:text="${livro.titulo}"></td>
        <td th:text="${livro.autor}"></td>
        <td th:text="${livro.isnb}"></td>
        <td>
            <a th:href="@{/livros/editar/{id}(id=${stat.index})}" style="color: blue; margin-right: 10px;">Editar</a>
            <form th:action="@{/livros/{id}(id=${stat.index})}" method="post" style="display:inline;">
                <input type="hidden" name="_method" value="delete" />
                <button type="submit" style="color: red;">Excluir</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(livros)}">
        <td colspan="4" style="text-align: center;">Nenhum livro cadastrado ainda.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
